<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BuggyShop</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            background: #f4f6f9;
        }

        header {
            background: #1f2937;
            color: white;
            padding: 18px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h2 {
            font-size: 28px;
        }

        .badge {
            background: #ef4444;
            color: white;
            padding: 4px 10px;
            border-radius: 20px;
        }

        .container {
            width: 90%;
            max-width: 1200px;
            margin: 30px auto;
        }

        input {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #ccc;
            margin-bottom: 25px;
            font-size: 16px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 20px;
        }

        .card {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0, 0, 0, .08);
            transition: .3s;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        .card img {
            width: 100%;
            height: 220px;
            object-fit: cover;
        }

        .details {
            padding: 15px;
        }

        .price {
            color: #2563eb;
            font-size: 20px;
            font-weight: bold;
            margin: 10px 0;
        }

        .stock {
            color: gray;
        }

        button {
            margin-top: 15px;
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            cursor: pointer;
            font-size: 15px;
        }

        button:hover {
            background: #1d4ed8;
        }

        #cart {
            margin-top: 40px;
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, .08);
        }

        #items div {
            padding: 8px 0;
            border-bottom: 1px solid #eee;
        }

        #total {
            margin-top: 15px;
            color: #2563eb;
        }

        footer {
            margin-top: 60px;
            padding: 20px;
            text-align: center;
            color: #777;
        }
    </style>

</head>

<body>

    <header>

        <h2>🛒 BuggyShop</h2>

        <div>
            Cart :
            <span class="badge" id="count">0</span>
        </div>

    </header>

    <div class="container">

        <input id="search" placeholder="Search Products..." onkeyup="search()">

        <div class="grid" id="products">

        </div>

        <div id="cart">

            <h2>Shopping Cart</h2>

            <br>

            <div id="items">

            </div>

            <h2 id="total">
                Total : ₹0
            </h2>

        </div>

    </div>

    <footer>

        BuggyShop QA Practice Website

    </footer>

    <script src="app.js"></script>

</body>

</html>
